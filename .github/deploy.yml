name: Deploy React app to GitHub Pages

on:
 push:
   branches:
      -main

permission:
  contents: read
  pages: write
  id-tocken: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: action/checkout@v4

      - name: Setup Node
        uses: action/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run Build

      - name: Setup Pages
        uses: action/configure-pages@v5

      - name: upload artifact
        uses: action/upload-pages-artifact@v3
        with:
          path: ./dist
          
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4  